name: Build Adam Way APK

on:
  push:
    branches:
      - claude/adam-way-queued-directions-2ze7ah
    paths:
      - 'AdamWay/**'
      - '.github/workflows/build-adam-way.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: set these in Settings -> Secrets and variables -> Actions
      # to also publish a download page to Netlify. Skipped until both are set.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # The action's own default ("tools platform-tools") includes the
          # legacy "tools" package, which Google has removed from the SDK
          # repository index and which makes this action fail outright.
          # platform-tools is all this build actually needs from it.
          packages: platform-tools

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        working-directory: AdamWay
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: AdamWay
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adam-way-debug-apk
          path: AdamWay/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="adam-way-build-${{ github.run_number }}"
          gh release create "$TAG" \
            "AdamWay/app/build/outputs/apk/debug/app-debug.apk" \
            --repo "${{ github.repository }}" \
            --title "Adam Way debug build #${{ github.run_number }}" \
            --notes "Automated unsigned debug build of Adam Way from commit ${{ github.sha }}. To install: download the APK to your phone and open it (you'll need to allow \"install unknown apps\" for whichever app you download it with)."

      - name: Deploy download page to Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          mkdir -p site-out
          cp AdamWay/site/index.html AdamWay/site/_headers site-out/
          cp AdamWay/app/build/outputs/apk/debug/app-debug.apk site-out/adam-way.apk
          sed -i "s/__BUILD__/${{ github.run_number }}/; s/__DATE__/$(date -u '+%d %b %Y %H:%M UTC')/; s/__SHA__/${GITHUB_SHA::7}/" site-out/index.html
          npx --yes netlify-cli@17 deploy --dir=site-out --prod --message "Build #${{ github.run_number }}"
