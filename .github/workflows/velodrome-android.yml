name: Velodrome Ghost (Android)

on:
  push:
    paths:
      - "velodrome/**"
      - ".github/workflows/velodrome-android.yml"
  pull_request:
    paths:
      - "velodrome/**"
      - ".github/workflows/velodrome-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velodrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (race engine, .zwo parser, FTMS)
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk velodrome-ghost.apk

      - uses: actions/upload-artifact@v4
        with:
          name: velodrome-ghost-apk
          path: velodrome/velodrome-ghost.apk

      # Each build gets its own release, so a download in progress is never replaced mid-way.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: velodrome-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Velodrome Ghost build #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Velodrome Ghost Android build #${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
            Download `velodrome-ghost.apk` below on your phone and open it to install
            (allow "install unknown apps" for your browser / My Files; turn off Samsung Auto Blocker if it blocks it).
          files: velodrome/velodrome-ghost.apk
